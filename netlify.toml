# Netlify build settings for Skylantic Holidays.
# Netlify detects Next.js and adds its Next.js runtime automatically.
# Required environment variables (Site configuration → Environment variables):
#   SESSION_SECRET, NEXT_PUBLIC_SITE_URL
# Optional: ADMIN_EMAIL, ADMIN_PASSWORD (the first admin, created on first login).
#
# Database:
# - Netlify Database (default): no variables needed. Netlify applies the SQL in
#   netlify/database/migrations just before each deploy goes live; starter content
#   is added on the first request.
# - External Postgres: set DATABASE_URL (and DIRECT_URL) and the build runs
#   `prisma migrate deploy` + seed itself.

[build]
  command = """
    if [ -n "$DATABASE_URL" ]; then \
      export DIRECT_URL="${DIRECT_URL:-$DATABASE_URL}" && \
      npx prisma migrate deploy && \
      if [ -n "$ADMIN_EMAIL" ]; then npm run db:seed; fi; \
    fi && \
    npm run build
  """
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # Make sure the Prisma query engine for AWS Lambda ships with the server function.
  included_files = [
    "node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node",
    "node_modules/.prisma/client/schema.prisma",
  ]
